[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "slide-gen-agent"
version = "0.1.0"
description = "AI Slide Deck & Speaker Script Generator"
dependencies = [
    "google-genai>=2.4.0",
    "google-cloud-storage>=2.14.0",
    "pillow>=10.0.0",
    "python-dotenv>=1.0.0",
    "a2a-sdk[http-server]~=0.3.22",
    "python-pptx",
    "google-api-python-client>=2.0.0",
    "qrcode>=7.4.2",
    "aiohttp>=3.13.4",
    "gcsfs>=2024.11.0",
    "google-adk[gcp]>=2.0.0,<3.0.0",
    "google-cloud-aiplatform[agent-engines,evaluation]>=1.156.0",
    "google-cloud-logging>=3.12.0,<4.0.0",
    "opentelemetry-instrumentation-google-genai>=0.1.0,<1.0.0",
    "protobuf>=6.31.1,<7.0.0",
]

[tool.agents-cli]
agent_directory = "adk_agent"

[tool.agents-cli.create_params]
deployment_target = "agent_runtime"
