[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "slide-gen-agent"
version = "0.1.0"
description = "AI Slide Deck & Speaker Script Generator"
dependencies = [
    "google-adk>=2.3.0",
    "google-genai>=2.4.0",
    "google-cloud-storage>=2.14.0",
    "google-cloud-logging>=3.0.0",
    "pydantic>=2.0.0",
    "Pillow>=10.0.0",
    "python-dotenv>=1.0.0",
    "a2a-sdk>=0.3.4,<0.4",
    "python-pptx",
    "google-api-python-client>=2.0.0",
    "qrcode>=7.4.2",
]

[tool.agents-cli]
agent_directory = "adk_agent"

[tool.agents-cli.create_params]
deployment_target = "agent_runtime"
