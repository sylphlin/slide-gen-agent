[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "slide-gen-agent"
version = "0.1.0"
description = "AI Slide Deck & Speaker Script Generator"
requires-python = ">=3.10,<3.13"
dependencies = [
    "google-adk>=2.3.0",
    "google-cloud-aiplatform>=1.158.0",
    "google-genai>=2.4.0",
    "google-cloud-storage>=2.14.0",
    "google-cloud-logging>=3.0.0",
    "pydantic>=2.0.0",
    "Pillow>=10.0.0",
    "python-dotenv>=1.0.0",
    "a2a-sdk[http-server]>=0.3.4,<0.4",
    "sse-starlette>=1.0.0",
    "starlette>=0.27.0",
    "python-pptx",
    "google-api-python-client>=2.0.0",
    "qrcode>=7.4.2",
]

[tool.hatch.build.targets.wheel]
packages = ["adk_agent"]

[tool.agents-cli]
agent_directory = "adk_agent"

[tool.agents-cli.create_params]
deployment_target = "agent_runtime"
